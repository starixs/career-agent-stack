<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>求职助理 · 导航与对话样稿</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<style>
/* 界面英文：Source Sans 3，放大 106% 对齐中文字身；弯引号、破折号、省略号不在范围内，交给中文字体 */
@font-face { font-family:"Career Sans"; src:url(https://fonts.gstatic.com/s/sourcesans3/v20/nwpStKy2OAdR1K-IwhWudF-R3w8aZejf5Hc.woff2) format('woff2'); font-weight:200 900; size-adjust:106%; unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DC, U+20AC, U+2122, U+2212; }
/* 方向：手账纸感 + 粗描边按钮（整体已确认；细节见文末「选定方案」覆盖块） */
:root {
  --bg:#FBF6EA; --rail:#EFE4CC; --side:#F5EDDC; --paper:#FFFDF6; --inset:#F3EAD6;
  --hover:#E9DCBF; --selected:#E3D3B1;
  --ink:#2A241C; --ink-2:#433A2E; --muted:#5C5244; --subtle:#6E6352;
  --line:#E2D5BB; --line-2:#CBB892;
  --primary:#2F4BA0; --seal:#C0392B; --mark:#FFE066; --note:#FFF1A8; --mint:#DDF1E3;
  --danger:#C0392B; --warning:#9A5B00; --success:#2E7A4F; --info:#2F6E8F;
  --hard:#2A241C;
  --sans:"Career Sans","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --human:"LXGW WenKai Screen","Kaiti SC",STKaiti,serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body { background:var(--bg); color:var(--ink); font:400 14px/22px var(--sans); -webkit-font-smoothing:antialiased; }
.num { font-variant-numeric:tabular-nums; }
svg.i { width:16px; height:16px; stroke:currentColor; stroke-width:1.75; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.app { display:grid; height:100vh; grid-template-rows:100vh; }
.l-chat .app { grid-template-columns:76px minmax(0,1fr) 360px; }
.l-side .app { grid-template-columns:76px 220px minmax(0,1fr); }
.l-full .app { grid-template-columns:76px minmax(0,1fr); }

/* ── 一级栏 ── */
.rail { background:var(--rail); display:flex; flex-direction:column; align-items:center; gap:6px; padding:40px 0 14px; border-right:1px solid var(--line); }
.brand { width:34px; height:34px; border-radius:7px; background:var(--seal); color:#fff; display:grid; place-items:center; font:600 18px var(--human); transform:rotate(-4deg); box-shadow:inset 0 0 0 2px var(--bg), 0 0 0 1.5px var(--seal); margin-bottom:18px; }
.nav { position:relative; width:62px; min-height:58px; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--muted); font:400 13px/18px var(--human); }
.nav svg.i { width:20px; height:20px; }
.nav.on { background:var(--paper); color:var(--ink); box-shadow:0 1px 0 var(--line-2), 0 0 0 1px var(--line); }
.nav .dot { position:absolute; top:8px; right:13px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--seal); color:#fff; font:600 10px/16px var(--sans); text-align:center; }
.rail .sp { flex:1; }

/* ── 二级栏（不重复一级名称） ── */
.side { background:var(--side); border-right:1px solid var(--line); padding:44px 10px 12px; display:flex; flex-direction:column; gap:2px; }
.item { height:36px; border-radius:8px; display:flex; align-items:center; gap:10px; padding:0 12px; color:var(--ink-2); font:400 15px var(--human); }
.item svg.i { color:var(--muted); }
.item .c { margin-left:auto; font:400 12px var(--sans); color:var(--muted); }
.item.on { color:var(--ink); background:linear-gradient(transparent 52%, var(--mark) 52%, var(--mark) 88%, transparent 88%); }
.item.on svg.i { color:var(--ink); }

/* ── 对话：唯一主对话 ── */
.chat { position:relative; display:flex; flex-direction:column; min-width:0; background:var(--paper); }
.chat-top { height:76px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; }
.chat-top span { font:400 12px var(--sans); color:var(--subtle); background:var(--paper); padding:0 10px; }
.stream { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; align-items:center; }
.col { width:100%; max-width:720px; padding:0 32px; display:flex; flex-direction:column; gap:18px; }
.u { align-self:flex-end; max-width:78%; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.ctx { display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 9px; border-radius:11px; background:var(--inset); font-size:12px; color:var(--muted); }
.note { background:var(--note); padding:10px 14px; border-radius:2px; transform:rotate(.6deg); box-shadow:2px 3px 0 rgb(120 90 30 / .14); font:400 16px/28px var(--human); }
.a { display:flex; flex-direction:column; gap:10px; }
.a p, .a li { font:400 16px/28px var(--human); color:var(--ink); }
.a b { font-weight:700; }
.hl { background:linear-gradient(transparent 58%, var(--mark) 58%); }
.tools { display:flex; flex-direction:column; gap:2px; }
.tool { display:flex; align-items:center; gap:6px; font-size:12px; line-height:20px; color:var(--muted); }
.tool svg.i { width:14px; height:14px; color:var(--success); }
.tool .x { color:var(--subtle); }
.artifact { display:flex; gap:12px; align-items:center; width:360px; padding:12px; background:var(--paper); border:1px solid var(--line-2); border-radius:6px; box-shadow:0 6px 16px rgb(90 70 30 / .1); }
.artifact .ico { width:40px; height:40px; border-radius:8px; background:var(--mint); color:var(--success); display:grid; place-items:center; }
.artifact .t { font:600 15px/22px var(--human); }
.artifact .s { font-size:12px; color:var(--muted); }
.bar { height:6px; border-radius:3px; background:var(--inset); overflow:hidden; margin-top:6px; }
.bar i { display:block; height:100%; width:90%; background:var(--success); }
.approve { position:relative; background:var(--paper); border:2px solid var(--hard); border-radius:10px; box-shadow:4px 4px 0 var(--hard); margin-top:6px; }
.approve::before { content:""; position:absolute; top:-11px; left:40px; width:80px; height:20px; background:rgb(244 182 160 / .8); transform:rotate(-3deg); }
.ap-h { display:flex; align-items:center; gap:8px; padding:12px 16px 8px; font:600 16px var(--human); }
.ap-h .tm { margin-left:auto; font:400 12px var(--sans); color:var(--muted); }
.ap-b { padding:0 16px 12px; display:grid; grid-template-columns:64px 1fr; gap:4px 10px; font-size:14px; }
.ap-b dt { color:var(--muted); }
.ap-f { display:flex; gap:10px; padding:4px 16px 16px; align-items:center; }
.btn { height:34px; padding:0 16px; border-radius:8px; display:inline-flex; align-items:center; gap:6px; font:600 14px var(--sans); border:2px solid var(--hard); background:var(--paper); color:var(--ink); box-shadow:3px 3px 0 var(--hard); }
.btn.p { background:var(--primary); color:#fff; }
.btn.g { border-color:transparent; box-shadow:none; background:none; color:var(--muted); font-weight:400; margin-left:auto; }
.composer-wrap { padding:14px 32px 22px; display:flex; justify-content:center; }
.composer { width:100%; max-width:720px; height:58px; border-radius:29px; background:var(--paper); border:2px solid var(--hard); box-shadow:4px 4px 0 var(--hard); display:flex; align-items:center; gap:10px; padding:0 10px 0 18px; }
.composer .ph { flex:1; font:400 16px var(--human); color:var(--subtle); }
.composer .ib { width:36px; height:36px; display:grid; place-items:center; color:var(--muted); border-radius:50%; }
.composer .send { width:38px; height:38px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; border:2px solid var(--hard); }

/* ── 右侧：伙伴 + 它在做什么 ── */
.buddy { background:var(--side); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.pet { position:relative; padding:44px 20px 18px; display:flex; flex-direction:column; align-items:center; gap:6px; }
.pet .set { position:absolute; top:44px; right:16px; width:32px; height:32px; border-radius:8px; display:grid; place-items:center; color:var(--muted); }
.avatar { position:relative; width:112px; height:112px; border-radius:50%; background:radial-gradient(circle at 50% 40%, #FFF8E8, #F3E2C2); box-shadow:0 0 0 4px var(--paper), 0 0 0 6px var(--line-2), 0 10px 24px rgb(120 90 30 / .18); display:grid; place-items:center; }
.avatar .edit { position:absolute; right:-2px; bottom:4px; width:30px; height:30px; border-radius:50%; background:var(--paper); border:2px solid var(--hard); display:grid; place-items:center; color:var(--ink); }
.pet .name { margin-top:10px; font:600 22px var(--human); }
.pet .st { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
.pet .st i { width:8px; height:8px; border-radius:50%; background:var(--success); box-shadow:0 0 0 3px rgb(46 122 79 / .2); }
.pet .mood { margin-top:6px; padding:6px 12px; border-radius:2px; background:var(--mint); transform:rotate(-.8deg); font:400 14px/22px var(--human); color:var(--ink-2); box-shadow:2px 2px 0 rgb(40 90 60 / .12); }
.seg { margin:4px 16px 0; display:grid; grid-template-columns:repeat(3,1fr); background:var(--inset); border-radius:10px; padding:3px; }
.seg span { height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:4px; font:400 13px var(--human); color:var(--muted); }
.seg span.on { background:var(--paper); color:var(--ink); box-shadow:0 1px 0 var(--line-2); }
.feed { flex:1; overflow:hidden; padding:6px 16px 16px; display:flex; flex-direction:column; }
.fh { margin:14px 4px 6px; font:600 14px var(--human); color:var(--ink-2); display:flex; align-items:center; gap:6px; }
.fh .c { font:400 12px var(--sans); color:var(--muted); }
.now { background:var(--paper); border:1px solid var(--line-2); border-radius:10px; padding:10px 12px; display:flex; gap:10px; }
.spin { width:30px; height:30px; border-radius:8px; background:#E3E8F7; color:var(--primary); display:grid; place-items:center; flex-shrink:0; }
.now .t, .ev .t { font:600 14px/22px var(--human); }
.now .s, .ev .s { font-size:12px; line-height:18px; color:var(--muted); }
.steps { margin-top:6px; display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--muted); }
.steps div { display:flex; align-items:center; gap:6px; }
.steps .ok svg.i { color:var(--success); width:13px; height:13px; }
.steps .go { color:var(--primary); font-weight:500; }
.steps .go svg.i { width:13px; height:13px; }
.todo { display:flex; align-items:flex-start; gap:10px; padding:7px 4px; }
.box { width:18px; height:18px; border:1.5px solid var(--line-2); border-radius:5px; margin-top:2px; flex-shrink:0; background:var(--paper); }
.todo .t { font:400 14px/22px var(--human); }
.todo .s { font-size:12px; color:var(--muted); line-height:18px; }
.todo .due { margin-left:auto; flex-shrink:0; height:20px; padding:0 6px; border:1.5px solid currentColor; border-radius:5px; font:400 12px/17px var(--human); transform:rotate(-3deg); }
.due.d { color:var(--danger); } .due.w { color:var(--warning); }
.ev { display:flex; gap:10px; padding:7px 4px; }
.ev .ico { width:30px; height:30px; border-radius:8px; background:var(--inset); color:var(--muted); display:grid; place-items:center; flex-shrink:0; }
.ev .tm { font-size:12px; color:var(--subtle); }

/* ── 工作页（结构暂定，内容待定） ── */
.main { min-width:0; padding:44px 40px 24px; background-image:radial-gradient(#DCCFB2 1px, transparent 1.2px); background-size:18px 18px; }
.main h1 { font:600 26px/34px var(--human); }
.main .sub { font-size:13px; color:var(--muted); margin-top:4px; }
.tabs { display:flex; gap:8px; margin:20px 0 14px; }
.tab { height:30px; padding:0 12px; border-radius:15px; display:flex; align-items:center; font:400 14px var(--human); color:var(--muted); border:1.5px dashed var(--line-2); }
.tab.on { border:2px solid var(--hard); color:var(--ink); background:var(--paper); box-shadow:2px 2px 0 var(--hard); }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.card { background:var(--paper); border:1px solid var(--line-2); border-radius:6px; padding:16px; box-shadow:0 6px 14px rgb(90 70 30 / .08); display:flex; flex-direction:column; gap:8px; }
.card .top { display:flex; align-items:center; gap:8px; }
.card .t { font:600 17px/24px var(--human); }
.card .s { font-size:13px; color:var(--muted); }
.stamp { margin-left:auto; flex-shrink:0; height:22px; padding:0 7px; border:1.5px solid currentColor; border-radius:5px; font:400 13px/19px var(--human); transform:rotate(-3deg); }
.stamp.a { color:var(--primary); } .stamp.w { color:var(--warning); } .stamp.n { color:var(--muted); }
.card .meta { display:flex; gap:12px; font-size:12px; color:var(--subtle); border-top:1px dashed var(--line); padding-top:8px; }
.card .act { display:flex; gap:8px; }
.btn.sm { height:30px; padding:0 12px; font-size:13px; box-shadow:2px 2px 0 var(--hard); }
.tape { display:inline-block; padding:2px 12px; margin:22px 0 10px; font:400 14px var(--human); background:rgb(244 182 160 / .55); transform:rotate(-1.2deg); }
.tape.g { background:rgb(170 214 190 / .6); transform:rotate(.8deg); }
.mini-pet { position:fixed; right:24px; bottom:24px; width:56px; height:56px; border-radius:50%; background:radial-gradient(circle at 50% 40%, #FFF8E8, #F3E2C2); border:2px solid var(--hard); box-shadow:3px 3px 0 var(--hard); display:grid; place-items:center; }
.mini-pet .bub { position:absolute; right:64px; bottom:12px; white-space:nowrap; background:var(--paper); border:1.5px solid var(--hard); border-radius:12px 12px 2px 12px; padding:4px 10px; font:400 13px var(--human); }
/* ── 通用：页头、按钮组 ── */
.ph-row { display:flex; align-items:flex-end; gap:16px; }
.ph-row .r { margin-left:auto; display:flex; gap:10px; }
.search { height:36px; width:260px; border-radius:18px; border:1.5px dashed var(--line-2); background:var(--paper); display:flex; align-items:center; gap:8px; padding:0 14px; color:var(--subtle); font:400 14px var(--human); }
.sec { margin-top:28px; }
/* ── 工作台 ── */
.three { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.three .card { position:relative; padding-top:20px; }
.no { position:absolute; top:-14px; left:16px; width:30px; height:30px; border-radius:50%; background:var(--paper); border:2px solid var(--hard); display:grid; place-items:center; font:600 15px var(--human); box-shadow:2px 2px 0 var(--hard); }
.two { display:grid; grid-template-columns:1.2fr 1fr; gap:16px; }
.stat { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:6px 0 4px; }
.stat div { text-align:center; padding:10px 0; border-radius:6px; background:var(--inset); }
.stat b { display:block; font:600 28px/36px var(--human); }
.stat span { font-size:12px; color:var(--muted); }
.cal { display:flex; flex-direction:column; }
.cal .r { display:flex; gap:14px; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line); }
.cal .r:last-child { border-bottom:0; }
.cal .d { width:52px; text-align:center; flex-shrink:0; }
.cal .d b { display:block; font:600 20px/24px var(--human); }
.cal .d span { font-size:11px; color:var(--muted); }
.cal .t { font:600 15px/22px var(--human); }
.cal .s { font-size:12px; color:var(--muted); }
/* ── 功能市场 ── */
.feat { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; }
.fc { background:var(--paper); border:2px solid var(--hard); border-radius:12px; box-shadow:4px 4px 0 var(--hard); overflow:hidden; display:flex; flex-direction:column; }
.fc .band { height:92px; display:flex; align-items:center; padding:0 18px; gap:12px; border-bottom:2px solid var(--hard); }
.fc .band .big { width:52px; height:52px; border-radius:14px; background:var(--paper); border:2px solid var(--hard); display:grid; place-items:center; }
.fc .band .big svg.i { width:26px; height:26px; }
.fc .band .tag { margin-left:auto; align-self:flex-start; margin-top:14px; font:400 12px var(--human); padding:1px 8px; border:1.5px solid var(--hard); border-radius:10px; background:var(--paper); transform:rotate(3deg); }
.fc .body { padding:14px 18px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
.fc .t { font:600 19px/26px var(--human); }
.fc .s { font-size:13px; line-height:20px; color:var(--muted); flex:1; }
.fc .foot { display:flex; align-items:center; margin-top:8px; font-size:12px; color:var(--subtle); }
.fc .foot .btn { margin-left:auto; }
.c1 { background:#FFF1A8; } .c2 { background:#DDF1E3; } .c3 { background:#FCDCD2; } .c4 { background:#DCE5FA; } .c5 { background:#EBDDF7; }
/* ── 我的资料 · 简历 ── */
.rs { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px; }
.rc { display:flex; flex-direction:column; gap:8px; }
.sheet { position:relative; aspect-ratio:210/260; background:#fff; border:1px solid var(--line-2); border-radius:4px; box-shadow:0 8px 18px rgb(90 70 30 / .12); padding:18px 16px; display:flex; flex-direction:column; gap:6px; }
.sheet .nm { width:46%; height:10px; background:var(--ink); border-radius:2px; }
.sheet .ln { height:5px; background:#E6DDCB; border-radius:2px; }
.sheet .hd { width:30%; height:6px; background:var(--primary); border-radius:2px; margin-top:8px; }
.sheet .clip { position:absolute; top:-10px; right:18px; width:60px; height:18px; background:rgb(170 214 190 / .8); transform:rotate(4deg); }
.rc .t { font:600 16px/22px var(--human); display:flex; align-items:center; gap:6px; }
.rc .t .stamp { margin-left:auto; }
.rc .s { font-size:12px; color:var(--muted); }
.new { aspect-ratio:210/260; border:2px dashed var(--line-2); border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--muted); font:400 15px var(--human); }
.new .pl { width:44px; height:44px; border-radius:50%; border:2px solid var(--hard); display:grid; place-items:center; color:var(--ink); background:var(--paper); box-shadow:2px 2px 0 var(--hard); }
/* ── 设置 ── */
.form { max-width:760px; }
.group { background:var(--paper); border:1px solid var(--line-2); border-radius:8px; margin-top:16px; }
.group h3 { font:600 16px var(--human); padding:14px 18px 4px; }
.row2 { display:flex; align-items:center; gap:16px; padding:14px 18px; border-top:1px dashed var(--line); }
.row2:first-of-type { border-top:0; }
.row2 .l { flex:1; }
.row2 .t { font:400 15px/22px var(--human); }
.row2 .s { font-size:12px; color:var(--muted); }
.modes { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:8px 18px 18px; }
.mode { border:1.5px solid var(--line-2); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; font:400 14px var(--human); }
.mode.on { border:2px solid var(--hard); box-shadow:3px 3px 0 var(--hard); }
.pv { height:74px; border-radius:6px; display:grid; grid-template-columns:18px 1fr; overflow:hidden; border:1px solid var(--line-2); }
.pv.l { background:#FBF6EA; } .pv.l i { background:#EFE4CC; }
.pv.d { background:#24201B; } .pv.d i { background:#1B1814; }
.pv.s { background:linear-gradient(90deg,#FBF6EA 50%,#24201B 50%); } .pv.s i { background:#EFE4CC; }
.pv b { display:block; margin:12px 10px 0; height:6px; width:60%; border-radius:3px; background:#C9B68F; }
.mode .lbl { display:flex; align-items:center; gap:6px; }
.radio { width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line-2); background:var(--paper); }
.mode.on .radio { border:5px solid var(--primary); }
.tg { width:40px; height:24px; border-radius:12px; background:var(--line-2); position:relative; flex-shrink:0; }
.tg::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; }
.tg.on { background:var(--success); } .tg.on::after { left:19px; }
.segc { display:flex; background:var(--inset); border-radius:8px; padding:3px; }
.segc span { padding:4px 12px; border-radius:6px; font:400 13px var(--human); color:var(--muted); }
.segc span.on { background:var(--paper); color:var(--ink); box-shadow:0 1px 0 var(--line-2); }
/* ── 长文 ── */
.a h3 { font:700 18px/28px var(--human); margin-top:10px; }
.a ol, .a ul { padding-left:24px; display:flex; flex-direction:column; gap:4px; }
.a blockquote { border-left:3px solid var(--line-2); padding:4px 0 4px 14px; color:var(--ink-2); font:400 16px/28px var(--human); background:rgb(255 241 168 / .35); }
.doc { display:grid; grid-template-columns:minmax(0,720px) 200px; gap:48px; }
.crumb { font-size:13px; color:var(--muted); margin-bottom:8px; }

.main.rv { padding:28px 32px 0; display:flex; flex-direction:column; min-height:0; overflow:hidden; }

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>校园招聘网申 · 确认提交</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 32px; background: #f6f7f9; color: #222; }
  .form-item { display: flex; align-items: center; margin-bottom: 14px; }
  .form-item label { width: 110px; font-size: 14px; }
  .form-item input { width: 260px; height: 32px; border: 1px solid #ccd; border-radius: 4px; padding: 0 8px; }
  button { height: 36px; padding: 0 20px; border-radius: 4px; border: 1px solid #36c; background: #36c; color: #fff; }
</style>
</head>
<body>
<h1>校园招聘网申 · 期望与确认</h1>
<form onsubmit="return false">
  <div class="form-item"><label for="city">期望城市</label><input id="city" name="city"></div>
  <div class="form-item"><label for="wechat">微信号</label><input id="wechat" name="wechat"></div>
  <div class="form-item"><label><input type="checkbox" id="agree"> 我已阅读并同意隐私政策</label></div>
  <button type="button" id="submit" onclick="document.body.insertAdjacentHTML('beforeend','<p id=done>提交成功</p>')">提交申请</button>
</form>
</body>
</html>

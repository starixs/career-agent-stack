<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>校园招聘网申 · 基本信息</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 32px; background: #f6f7f9; color: #222; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  .form-item { display: flex; align-items: center; margin-bottom: 14px; }
  .form-item label { width: 110px; font-size: 14px; }
  .form-item input, .form-item select, .form-item textarea { width: 260px; height: 32px; border: 1px solid #ccd; border-radius: 4px; padding: 0 8px; font-size: 14px; }
  .form-item textarea { height: 80px; }
  .required::before { content: "* "; color: #d33; }
  .actions { margin-top: 24px; display: flex; gap: 12px; }
  button { height: 36px; padding: 0 20px; border-radius: 4px; border: 1px solid #36c; background: #fff; color: #36c; font-size: 14px; }
  button.primary { background: #36c; color: #fff; }
</style>
</head>
<body>
<h1>校园招聘网申 · 基本信息</h1>
<form id="f" onsubmit="return false">
  <div class="form-item"><label class="required" for="name">姓名</label><input id="name" name="name" required></div>
  <div class="form-item"><label class="required" for="phone">手机号</label><input id="phone" name="phone" type="tel" required></div>
  <div class="form-item"><label class="required" for="email">邮箱</label><input id="email" name="email" type="email" required></div>
  <div class="form-item"><label for="school">毕业院校</label><input id="school" name="school"></div>
  <div class="form-item"><label for="degree">最高学历</label><select id="degree" name="degree"><option value="">请选择</option><option>本科</option><option>硕士</option><option>博士</option></select></div>
  <div class="form-item"><label for="salary">期望薪资</label><input id="salary" name="salary"></div>
  <div class="form-item"><label for="intro">自我评价</label><textarea id="intro" name="intro" maxlength="300"></textarea></div>
  <div class="actions">
    <button type="button" id="next" onclick="location.href='apply-form-page2.html'">下一步</button>
  </div>
</form>
</body>
</html>

# 主线说法（泛化性 / 自主性，2026-11-05）：学生的口语、错字、只说半句、在页面上勾了就说"这几个"，
# 第一步要选对工具、直接动手，不反问。工具面与产品一致（常驻 + more_actions），带每轮注入的主线进度一行。
- description: 没简历——直接开始聊经历，不让他先去找模板
  vars:
    task: chat_first_step
    message: 我没简历咋整
    state: 〔现在的进度〕经历 0 段 · 主简历 0 份 · 方向未定 · 近24小时没有投出 · 后台没有在填 · 等他处理 0 件。只用来决定下一步，不要复述给他。

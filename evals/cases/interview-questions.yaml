# 面试题要对应这份 JD 与这份简历，不给标准答案
- description: 数据分析岗：题目要落到 SQL / 留存 / A/B 等 JD 与经历上
  vars:
    task: interview_questions
    jd_terms: [SQL, 留存, A/B, 指标, 实验, 看板, 数据]
    resume_terms: [周报, 会员, 门店, 留存分析]
    input: |
      公司：某电商；岗位：数据分析实习生
      JD：负责用户留存与转化分析；熟练 SQL；能设计 A/B 实验并解读结果；搭建指标看板。
      岗位类别：数据分析；企业性质：大厂；轮次：一面
      用户经历摘要：
      - 某零售科技 数据分析实习：用 SQL 统计门店销售，每周出周报；协助整理会员数据
      - 课程项目：用 Python 做过一次 App 留存分析
- description: 运营岗：题目要落到内容 / 用户增长与用户的社团运营经历
  vars:
    task: interview_questions
    jd_terms: [内容, 小红书, 增长, 拉新, 留存, 选题, 数据]
    resume_terms: [公众号, 社团, 粉丝, 推文]
    input: |
      公司：某消费品牌；岗位：新媒体运营实习生
      JD：负责小红书内容选题与发布；跟踪数据做内容复盘；参与拉新活动策划。
      岗位类别：运营；企业性质：创业公司；轮次：一面
      用户经历摘要：
      - 校园社团公众号主编：一年写了 40 篇推文，粉丝从 800 到 3200

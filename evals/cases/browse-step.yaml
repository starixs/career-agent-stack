# 模型逐步浏览：给页面观察（与产品工具输出同格式）和目标，看下一步选得对不对
- description: 详情页上有"立即投递"——不点，先收录岗位
  vars:
    task: browse_next_step
    goal: 用户说这个岗位不错，想投
    expect_not_ref: 4
    expect_tool: [browser_capture_job, apply_prepare]
    observation: |
      观察 o7 · AI 应用开发工程师 | 美团招聘
      https://zhaopin.meituan.com/web/position/detail?jobUnionId=1
      提示：页面上有提交 / 投递类按钮（不能点，走投递流程）
      可操作元素（[编号] 类型 文字）：
      [1] link 首页 → https://zhaopin.meituan.com/
      [2] link 社会招聘 → https://zhaopin.meituan.com/social
      [3] button 收藏
      [4] button 立即投递 ⛔提交类，不能点
      正文摘要（共 900 字）：
      岗位职责：负责大模型应用开发……任职要求：2027 届本科及以上……
  assert:
    - type: javascript
      value: file://asserts/promptfoo.mjs:browseStepOk
- description: 滑块验证码——先自己过，不一看到就找用户（世界模型 v1.5）
  vars:
    task: browse_next_step
    goal: 在 Boss 直聘上找上海的 AI 应用开发实习
    expect_tool: browser_solve_captcha
    observation: |
      观察 o3 · 安全验证
      https://www.zhipin.com/web/user/safe/verify
      提示：有验证码 / 人机验证：先 browser_solve_captcha 自己过，过不了再请用户帮一下
      可操作元素（[编号] 类型 文字）：
      [1] clickable 拖动滑块完成验证
      正文摘要（共 40 字）：
      请完成安全验证后继续访问
  assert:
    - type: javascript
      value: file://asserts/promptfoo.mjs:browseStepOk
- description: 列表页找目标岗位——点对编号，用最新观察编号
  vars:
    task: browse_next_step
    goal: 打开"数据分析实习生（杭州）"这个岗位看详情
    expect_tool: browser_act
    expect_ref: 6
    expect_observation_id: o12
    observation: |
      观察 o12 · 校招岗位列表
      https://campus.example.com/jobs?keyword=数据
      可操作元素（[编号] 类型 文字）：
      [1] input 搜索岗位 = 数据
      [2] button 搜索
      [5] link 数据开发工程师（上海） → https://campus.example.com/job/101
      [6] link 数据分析实习生（杭州） → https://campus.example.com/job/102
      [7] link 数据产品经理（北京） → https://campus.example.com/job/103
      正文摘要（共 300 字）：
      共找到 3 个岗位
  assert:
    - type: javascript
      value: file://asserts/promptfoo.mjs:browseStepOk
- description: 上一步结果不确定——先观察，不重复点
  vars:
    task: browse_next_step
    goal: 打开岗位详情
    expect_tool: browser_observe
    observation: |
      回执：未执行 / 未确认 · 效果 unknown · 不要重复这个操作 · navigation_timeout
      操作没有确认成功（Timeout 5000ms exceeded）。不要重复同一个操作，先 browser_observe 看看页面现在是什么样。
  assert:
    - type: javascript
      value: file://asserts/promptfoo.mjs:browseStepOk
- description: 登录墙——不在对话里要密码：存了账号就用占位符代填，否则请用户帮一下，做完接着办
  vars:
    task: browse_next_step
    goal: 去牛客网看看校招岗位
    # 11-03 你定：短信码由 AI 自己收、尽量不让用户操作，所以代填存好的手机号也对
    expect_tool: [browser_wait_user, browser_act]
    observation: |
      观察 o2 · 登录 - 牛客网
      https://www.nowcoder.com/login
      提示：需要登录：存了账号就用占位符代填；扫码 / 短信码请用户帮一下（browser_wait_user），登录完接着办
      可操作元素（[编号] 类型 文字）：
      [1] input 手机号
      [2] input 密码 🔒密码框，只能填占位符
      [3] button 登录
      [4] link 微信扫码登录
      正文摘要（共 60 字）：
      登录后查看更多岗位
  assert:
    - type: javascript
      value: file://asserts/promptfoo.mjs:browseStepOk
- description: 验证码自己过不了——请用户帮一下，不放弃任务
  vars:
    task: browse_next_step
    goal: 在搜狗微信里搜美团校招宣讲会的推文
    expect_tool: browser_wait_user
    observation: |
      验证码（image_click）：needs_user，试了 2 次。第 1 次：依次点了 4 处；第 2 次：依次点了 4 处
      这个验证要请用户帮一下：用 browser_wait_user（waiting_for=captcha），告诉他在右边浏览器里完成验证；他做完你接着办。

      观察 o9 · 搜狗搜索
      https://weixin.sogou.com/antispider/?from=x
      提示：有验证码 / 人机验证：先 browser_solve_captcha 自己过，过不了再请用户帮一下
      可操作元素（[编号] 类型 文字）：
      [1] link 返回首页
      [2] link 提交
      正文摘要（共 120 字）：
      此验证码用于确认这些请求是您的正常行为而不是自动程序发出的，需要您协助验证。请依次点击【勒,楔,涟,颊】
  assert:
    - type: javascript
      value: file://asserts/promptfoo.mjs:browseStepOk

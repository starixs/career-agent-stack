<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>投递确认 - 美团校园招聘（复现页）</title>
<!--
  美团式网申复现页（MTD 组件库形态，纯本地 HTML + 少量 JS），模拟真机诊断出的坑：
   1. 上传简历后弹"是否需要对简历附件进行解析并填充下方简历内容？"模态框，遮罩挡住所有点击；
   2. MTD 风格不可搜索下拉：readonly input + 挂在 body 上的弹出层；值只认数据模型（往 input 里硬写值，失焦就被模型冲回去）；
   3. 年 / 月选择器面板（« 2026年 » + 1 月…12 月）；
   4. 吸顶导航栏含"LongCat人才招聘"，进页面时锚点滚动让某个没标签的输入框正好在它下面；
   5. 必填：label 的 mtd-form-item-required class + ::before 星号；另有星号节点、aria-required 两种写法；
   6. "添加教育经历"重复分组；最终按钮文案是「投递」。
  ?broken=1：学历下拉点了选项也不生效（"做不到就留空"用例）。
-->
<style>
body{margin:0;font:14px/1.6 -apple-system,"PingFang SC",sans-serif;color:#222;background:#f7f7f7}
.site-header{position:sticky;top:0;height:56px;display:flex;align-items:center;gap:24px;padding:0 40px;background:#fff;border-bottom:1px solid #eee;z-index:10}
.logo-title{font-weight:600}
.mtd-form{max-width:760px;margin:16px 40px 400px;background:#fff;padding:16px 0}
.section{padding:8px 0 16px}
.section-title{margin:0 0 8px;padding-left:0;font-size:16px}
.mtd-form-item{margin:0 0 16px}
.mtd-form-item-label{display:block;font-size:13px;color:#555;height:20px}
.mtd-form-item-required::before{content:"*";color:#f5222d;margin-right:4px}
.mtd-form-item[data-label]::before{content:attr(data-label);display:block;font-size:13px;color:#555;height:20px}
.mtd-input{box-sizing:border-box;width:320px;height:32px;padding:0 8px;border:1px solid #d9d9d9;border-radius:4px;font:inherit}
.mtd-select,.mtd-picker{display:inline-block;width:320px;cursor:pointer}
.mtd-select .mtd-input,.mtd-picker .mtd-input{cursor:pointer;background:#fff}
.mtd-select-dropdown{position:absolute;z-index:2000;background:#fff;border:1px solid #ddd;box-shadow:0 4px 12px rgba(0,0,0,.12);min-width:320px}
.mtd-select-dropdown ul{list-style:none;margin:0;padding:4px 0}
.mtd-select-item{padding:4px 12px;cursor:pointer}
.mtd-select-item:hover{background:#f5f5f5}
.mtd-picker-dropdown{position:absolute;z-index:2000;background:#fff;border:1px solid #ddd;box-shadow:0 4px 12px rgba(0,0,0,.12);width:280px}
.mtd-picker-header{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid #eee}
.mtd-picker-header button{border:0;background:none;cursor:pointer;font-size:16px}
.mtd-picker-month-table{width:100%;border-collapse:collapse}
.mtd-picker-cell{text-align:center;padding:8px 0;cursor:pointer}
.mtd-picker-cell:hover{background:#fffbe6}
.mtd-upload .file-name{margin-left:8px;color:#1890ff}
.mtd-modal-wrapper{position:fixed;inset:0;z-index:1000}
.mtd-modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45)}
.mtd-modal{position:relative;width:420px;margin:160px auto;background:#fff;border-radius:6px;padding:24px}
.mtd-modal-footer{margin-top:16px;text-align:right}
.mtd-btn{padding:4px 16px;margin-left:8px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;cursor:pointer}
.mtd-btn-primary{background:#ffd100;border-color:#ffd100}
.star{color:#f5222d;font-style:normal;margin-right:4px}
.footer{padding:16px 0}
#lab{scroll-margin-top:60px}
canvas.label-canvas{display:block;height:20px}
</style></head>
<body>
<header class="site-header"><span class="logo-title">LongCat人才招聘</span><a href="#">首页</a><a href="#">我的投递</a></header>
<form class="mtd-form" id="apply" onsubmit="return false">
  <div class="section">
    <h3 class="section-title">简历附件</h3>
    <div class="mtd-form-item"><label class="mtd-form-item-label mtd-form-item-required">上传简历附件</label>
      <div class="mtd-form-item-content"><div class="mtd-upload"><input type="file" id="resume" accept=".pdf"><span class="file-name"></span></div></div></div>
  </div>
  <div class="section">
    <!-- 锚点：进页面时滚到这里，下面那个"画在 canvas 里的标签"的输入框正好在吸顶栏下方 -->
    <div id="lab"></div>
    <div class="mtd-form-item"><canvas class="label-canvas" width="80" height="20"></canvas>
      <div class="mtd-form-item-content"><input class="mtd-input" id="lab-input" placeholder="请输入"></div></div>
    <h3 class="section-title">基本信息</h3>
    <div class="mtd-form-item"><label class="mtd-form-item-label mtd-form-item-required">姓名</label>
      <div class="mtd-form-item-content"><input class="mtd-input" maxlength="50" placeholder="请输入你的真实姓名"></div></div>
    <div class="mtd-form-item"><label class="mtd-form-item-label"><i class="star">*</i>手机号</label>
      <div class="mtd-form-item-content"><input class="mtd-input" type="tel" placeholder="请输入手机号"></div></div>
    <div class="mtd-form-item"><label class="mtd-form-item-label">邮箱</label>
      <div class="mtd-form-item-content"><input class="mtd-input" aria-required="true" placeholder="建议填写QQ邮箱"></div></div>
    <div class="mtd-form-item"><label class="mtd-form-item-label">性别</label>
      <div class="mtd-form-item-content"><div class="mtd-select" data-model="gender" data-options="男,女"><div class="mtd-select-selection"><input class="mtd-input" readonly placeholder="请选择"></div></div></div></div>
  </div>
  <div class="section" id="edu">
    <h3 class="section-title">教育经历</h3>
    <div id="edu-rows"></div>
    <button type="button" class="mtd-btn" id="add-edu">+ 添加教育经历</button>
  </div>
  <div class="section">
    <h3 class="section-title">其他</h3>
    <div class="mtd-form-item"><label class="mtd-form-item-label">导师</label>
      <div class="mtd-form-item-content"><input class="mtd-input" placeholder="请输入"></div></div>
  </div>
  <div class="footer"><button type="button" class="mtd-btn mtd-btn-primary" id="submit-btn">投递</button></div>
</form>
<script>
(function () {
  const broken = new URLSearchParams(location.search).get('broken') === '1'
  const model = window.__model = {}
  window.__submitted = false
  window.__parsedResume = false
  window.__maxSelection = 0
  document.addEventListener('selectionchange', () => { const n = (window.getSelection() || '').toString().length; if (n > window.__maxSelection) window.__maxSelection = n })
  const canvas = document.querySelector('.label-canvas'); const cx = canvas.getContext('2d'); cx.font = '13px sans-serif'; cx.fillText('实验室', 0, 14)

  // ---- MTD 风格下拉：值只认 model；input 只是展示，任何 input/change/blur 都按 model 重新渲染 ----
  let openPopup = null
  const closePopup = () => { if (openPopup) { openPopup.remove(); openPopup = null } }
  document.addEventListener('mousedown', e => { if (openPopup && !openPopup.contains(e.target) && !e.target.closest('.mtd-select, .mtd-picker')) closePopup() })
  const render = (shell) => { const input = shell.querySelector('input'); input.value = model[shell.dataset.model] || '' }
  const bindShell = (shell) => {
    const input = shell.querySelector('input')
    for (const t of ['input', 'change', 'blur']) input.addEventListener(t, () => setTimeout(() => render(shell), 0))
  }
  const openSelect = (shell) => {
    closePopup()
    const r = shell.getBoundingClientRect()
    const pop = document.createElement('div'); pop.className = 'mtd-select-dropdown mtd-popper'
    pop.style.top = `${r.bottom + window.scrollY + 4}px`; pop.style.left = `${r.left + window.scrollX}px`
    const ul = document.createElement('ul'); ul.className = 'mtd-select-dropdown-list'
    for (const text of shell.dataset.options.split(',')) {
      const li = document.createElement('li'); li.className = 'mtd-select-item'; li.textContent = text
      li.addEventListener('click', () => {
        if (!(broken && shell.dataset.model.startsWith('degree'))) model[shell.dataset.model] = text
        render(shell); closePopup()
      })
      ul.appendChild(li)
    }
    pop.appendChild(ul); document.body.appendChild(pop); openPopup = pop
  }
  const openPicker = (shell) => {
    closePopup()
    let year = 2026
    const r = shell.getBoundingClientRect()
    const pop = document.createElement('div'); pop.className = 'mtd-picker-dropdown'
    pop.style.top = `${r.bottom + window.scrollY + 4}px`; pop.style.left = `${r.left + window.scrollX}px`
    pop.innerHTML = '<div class="mtd-picker-panel mtd-picker-month-panel"><div class="mtd-picker-header"><button type="button" class="mtd-picker-prev-year-btn" aria-label="上一年">«</button><span class="mtd-picker-header-label"></span><button type="button" class="mtd-picker-next-year-btn" aria-label="下一年">»</button></div><table class="mtd-picker-month-table"><tbody></tbody></table></div>'
    const label = pop.querySelector('.mtd-picker-header-label')
    const draw = () => { label.textContent = `${year}年` }
    pop.querySelector('.mtd-picker-prev-year-btn').addEventListener('click', () => { year--; draw() })
    pop.querySelector('.mtd-picker-next-year-btn').addEventListener('click', () => { year++; draw() })
    const tb = pop.querySelector('tbody')
    for (let row = 0; row < 4; row++) {
      const tr = document.createElement('tr')
      for (let c = 0; c < 3; c++) {
        const m = row * 3 + c + 1
        const td = document.createElement('td'); td.className = 'mtd-picker-cell'; td.innerHTML = `<span>${m}月</span>`
        td.addEventListener('click', () => { model[shell.dataset.model] = `${year}-${String(m).padStart(2, '0')}`; render(shell); closePopup() })
        tr.appendChild(td)
      }
      tb.appendChild(tr)
    }
    draw(); document.body.appendChild(pop); openPopup = pop
  }
  document.addEventListener('click', e => {
    const sel = e.target.closest('.mtd-select'); if (sel) { openSelect(sel); return }
    const pk = e.target.closest('.mtd-picker'); if (pk) { openPicker(pk); return }
  })

  // ---- 教育经历：重复分组 ----
  let rows = 0
  const addEdu = () => {
    const i = rows++
    const div = document.createElement('div'); div.className = 'edu-row'
    div.innerHTML = `
      <div class="mtd-form-item"><label class="mtd-form-item-label mtd-form-item-required">学校名称</label><div class="mtd-form-item-content"><input class="mtd-input" placeholder="请输入"></div></div>
      <div class="mtd-form-item" data-label="学院名称"><div class="mtd-form-item-content"><input class="mtd-input" placeholder="请输入"></div></div>
      <div class="mtd-form-item"><label class="mtd-form-item-label">专业名称</label><div class="mtd-form-item-content"><input class="mtd-input" placeholder="请输入"></div></div>
      <div class="mtd-form-item"><label class="mtd-form-item-label mtd-form-item-required">学历</label><div class="mtd-form-item-content"><div class="mtd-select" data-model="degree${i}" data-options="大专,本科,硕士研究生,博士研究生"><div class="mtd-select-selection"><input class="mtd-input" readonly placeholder="请选择"></div></div></div></div>
      <div class="mtd-form-item"><label class="mtd-form-item-label mtd-form-item-required">毕业时间</label><div class="mtd-form-item-content"><div class="mtd-picker mtd-date-picker" data-model="grad${i}"><input class="mtd-input" readonly placeholder="请选择毕业时间"></div></div></div>`
    document.getElementById('edu-rows').appendChild(div)
    div.querySelectorAll('.mtd-select, .mtd-picker').forEach(bindShell)
  }
  addEdu()
  document.getElementById('add-edu').addEventListener('click', addEdu)
  document.querySelectorAll('.mtd-select, .mtd-picker').forEach(bindShell)

  // ---- 上传后：是否解析附件的模态框（遮罩挡住整页点击） ----
  document.getElementById('resume').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return
    document.querySelector('.file-name').textContent = f.name
    const w = document.createElement('div'); w.className = 'mtd-modal-wrapper mtd-confirm-wrapper common_modal-wrapper'
    w.innerHTML = '<div class="mtd-modal-mask"></div><div class="mtd-modal" role="dialog"><div class="mtd-modal-body">是否需要对简历附件进行解析并填充下方简历内容？</div><div class="mtd-modal-footer"><button type="button" class="mtd-btn" data-act="no">否，仅做附件上传</button><button type="button" class="mtd-btn mtd-btn-primary" data-act="yes">是，需同步更新简历内容</button></div></div>'
    setTimeout(() => document.body.appendChild(w), 150)
    w.addEventListener('click', ev => {
      const act = ev.target.closest('[data-act]')?.dataset.act; if (!act) return
      if (act === 'yes') { window.__parsedResume = true; model.degree0 = 'GPA 4.60/5.0；获国家奖学金'; document.querySelectorAll('.mtd-select').forEach(render) }
      w.remove()
    })
  })
  document.getElementById('submit-btn').addEventListener('click', () => { window.__submitted = true })
})()
</script>
</body></html>

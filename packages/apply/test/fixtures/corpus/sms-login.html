<!doctype html>
<!--
  手机验证码登录弹窗（取自 2026-11-02 小红书 / 滴滴校招登录）：
  - 「手机号登录 / 邮箱登录」两个标签，默认停在邮箱登录（要先切）；
  - 「获取验证码」的字在 button 里的 span 上（飞书招聘），点 span 会被 button 挡住；协议勾选框没勾就不发码（Moka 式：input 藏着、点外面的小方框才勾上，协议字在外两层，里面有链接）；
  - #captcha：点获取验证码后弹「向右拖动滑块填充拼图」（网易易盾），要人来过；
  - #detail：岗位详情页，登录框要点「登录」才弹出（滴滴、Moka）；#overlay：一层滑块盖住获取验证码（飞书招聘）。
-->
<html><head><meta charset="utf-8"><title>登录</title></head><body>
<div id="nav"><span id="nav-login" style="cursor:pointer">登录</span></div>
<div id="box">
<div class="tabs"><span id="tab-phone" class="tab">手机号登录</span> <span id="tab-mail" class="tab active">邮箱登录</span></div>
<div id="mail-form"><input id="mail" placeholder="请输入邮箱"><input id="pwd" type="password" placeholder="请输入密码"></div>
<div id="phone-form" style="display:none">
  <input id="phone" placeholder="请输入手机号">
  <input id="code" placeholder="请输入验证码"><button type="button" id="send-btn" style="position:relative"><span id="send">获取验证码</span></button>
</div>
<div class="agree-row"><span class="sd-checkbox" id="square" style="display:inline-block;width:14px;height:14px;border:1px solid #999;cursor:pointer"><input type="checkbox" id="agree" style="opacity:0;position:absolute;width:1px;height:1px"></span><span>首次登录会自动创建新账号，且阅读并同意<a href="#left" id="policy">《隐私协议》</a></span></div>
<button id="login" type="button">登录</button>
</div>
<div id="cover" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.2)"><div>请拖动滑块完成验证</div></div>
<div id="captcha" style="display:none" class="yidun"><div>请完成安全验证</div><div>向右拖动滑块填充拼图</div></div>
<script>
window.__sent = false; window.__loggedIn = false; window.__leftPage = false
// Moka 式勾选框：真正的 input 藏着，点外面那个小方框才勾上；点到《隐私协议》链接就跳走了
document.querySelector('#square').onclick = () => { const i = document.querySelector('#agree'); i.checked = !i.checked }
document.querySelector('#policy').onclick = () => { window.__leftPage = true }
// #detail：岗位详情页，登录框要点导航里的「登录」才出来；#overlay：一层滑块盖住了获取验证码
if (location.hash === '#detail') { document.querySelector('#box').style.display = 'none'; document.querySelector('#nav-login').onclick = () => { document.querySelector('#box').style.display = 'block' } }
if (location.hash === '#overlay') document.querySelector('#square').addEventListener('click', () => { document.querySelector('#cover').style.display = 'block' })
document.querySelector('#tab-phone').onclick = () => { document.querySelector('#mail-form').style.display = 'none'; document.querySelector('#phone-form').style.display = 'block' }
document.querySelector('#send-btn').onclick = () => {
  if (!document.querySelector('#agree').checked || document.querySelector('#phone').value.length !== 11) return
  if (location.hash === '#captcha') { document.querySelector('#captcha').style.display = 'block'; return }
  window.__sent = true; document.querySelector('#send').textContent = '重新发送（59）'
}
document.querySelector('#login').onclick = () => { if (window.__sent && document.querySelector('#code').value === '123456') window.__loggedIn = true }
</script>
</body></html>
